services:
  homey-ai-proxy:
    build: .
    container_name: homey-ai-proxy
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: ${LOG_FILE:-/app/logs/homey-ai-proxy.log}
      CONFIG_PATH: ${CONFIG_PATH:-/app/config.yaml}
      HOMEY_BASE_URL: ${HOMEY_BASE_URL:-http://homey.local}
      HOMEY_TOKEN: ${HOMEY_TOKEN:-}
      HOMEY_USE_MOCK: ${HOMEY_USE_MOCK:-true}
      HOMEY_TRANSPORT: ${HOMEY_TRANSPORT:-local}
      HOMEY_AUTH_MODE: ${HOMEY_AUTH_MODE:-static_token}
      HOMEY_OAUTH_CLIENT_ID: ${HOMEY_OAUTH_CLIENT_ID:-}
      HOMEY_OAUTH_CLIENT_SECRET: ${HOMEY_OAUTH_CLIENT_SECRET:-}
      HOMEY_OAUTH_REFRESH_TOKEN: ${HOMEY_OAUTH_REFRESH_TOKEN:-}
      HOMEY_OAUTH_ACCESS_TOKEN: ${HOMEY_OAUTH_ACCESS_TOKEN:-}
      HOMEY_MAX_REQUESTS_PER_MINUTE: ${HOMEY_MAX_REQUESTS_PER_MINUTE:-5}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      COMMAND_DEBOUNCE_SECONDS: ${COMMAND_DEBOUNCE_SECONDS:-10}
      HOMEY_RETRY_ATTEMPTS: ${HOMEY_RETRY_ATTEMPTS:-3}
      HOMEY_RETRY_BASE_DELAY_SECONDS: ${HOMEY_RETRY_BASE_DELAY_SECONDS:-0.5}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
